version: 0.1.2
repository: https://github.com/PurpleSoftSrl/sumup_api_client
homepage: https://github.com/PurpleSoftSrl/sumup_api_client
issue_tracker: https://github.com/PurpleSoftSrl/sumup_api_client/issues
topics:
  - sumup
