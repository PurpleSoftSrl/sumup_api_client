dependencies:
  clock: ^1.1.0
  collection: ^1.18.0
  dio: ^5.7.0
  dio_mcache: ^0.1.4
  logging: ^1.3.0
  mcache_dart: ^0.1.10

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
